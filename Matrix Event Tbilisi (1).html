<style>
/* Layout: one dark screen of falling code; title block, then three ticket rows, then a bottom sheet for checkout. Single deliberate dark theme. */
:root{
  --bg:#050806;
  --panel:#0b120d;
  --panel-2:#101a13;
  --line:#1d3324;
  --fg:#d9f2df;
  --muted:#7fa38a;
  --green:#3dff7a;
  --green-dim:#1f8a44;
  --danger:#ff6b6b;
  --display:"Unbounded","Noto Sans Georgian",system-ui,sans-serif;
  --body:"IBM Plex Mono","Noto Sans Georgian",ui-monospace,Menlo,monospace;
  --geo:"Noto Sans Georgian","IBM Plex Mono",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;min-height:100%;overflow-x:hidden}
html[lang="ka"] body{font-family:var(--geo)}
#rain{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100lvh;z-index:0;opacity:.6;pointer-events:none;display:block}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(5,8,6,.25) 45%,rgba(5,8,6,.55) 100%)}
@media (max-width:640px){#rain{opacity:.7}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:40px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mark{font-family:var(--body);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(11,18,13,.8)}
.langs button{all:unset;cursor:pointer;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.08em;padding:8px 12px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.langs button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}

.hero{display:flex;flex-direction:column;gap:14px;padding-top:24px}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(44px,13vw,112px);line-height:.92;letter-spacing:-.02em;text-wrap:balance;color:var(--fg);text-shadow:0 0 24px rgba(61,255,122,.35)}
h1 .g{color:var(--green)}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--fg)}
.meta span{display:inline-flex;gap:8px;align-items:center}
.meta b{color:var(--green);font-weight:500}

.section-h{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.tickets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.tickets{grid-template-columns:1fr}}
.ticket{position:relative;display:flex;flex-direction:column;gap:16px;padding:22px 20px 20px;background:rgba(11,18,13,.88);border:1px solid var(--line);border-radius:6px;min-width:0;backdrop-filter:blur(4px)}
.ticket::before{content:"";position:absolute;left:-1px;right:-1px;top:62%;border-top:1px dashed var(--line)}
.ticket.vip{border-color:var(--green-dim);background:rgba(16,26,19,.92);box-shadow:0 0 0 1px rgba(61,255,122,.12),0 0 40px rgba(61,255,122,.08)}
.t-name{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.01em;line-height:1.15}
.t-tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green)}
.price{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.price small{font-size:22px;color:var(--green);margin-left:4px}
.incl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--muted);flex:1}
.incl li{display:flex;gap:10px}
.incl li::before{content:">";color:var(--green);flex:none}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;padding:15px 18px;border-radius:4px;background:var(--green);color:var(--bg);width:100%;transition:transform .12s ease,box-shadow .2s ease}
html[lang="ka"] .btn{font-family:var(--geo);letter-spacing:.04em}
.btn:hover{box-shadow:0 0 24px rgba(61,255,122,.45)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green-dim)}
.btn[disabled]{background:var(--panel-2);color:var(--muted);cursor:not-allowed;box-shadow:none}

.note{font-size:12.5px;color:var(--muted);max-width:62ch}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:640px){.sheet{border-radius:10px;border-bottom:1px solid var(--line)}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{margin:0;font-family:var(--display);font-size:18px;font-weight:700;line-height:1.25}
.sheet-h .sel{font-size:13px;color:var(--green);margin-top:4px;font-variant-numeric:tabular-nums}
.x{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--muted);flex:none;font-size:18px}
.x:focus-visible{outline:2px solid var(--green)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
@media (max-width:380px){.fields{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px 12px;width:100%}
.f input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(61,255,122,.15)}
.f input[aria-invalid="true"]{border-color:var(--danger)}
.checks{display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;cursor:pointer}
.chk input{appearance:none;flex:none;width:20px;height:20px;margin:1px 0 0;border:1px solid var(--green-dim);border-radius:3px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--green);border-color:var(--green)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.link{all:unset;cursor:pointer;color:var(--green);text-decoration:underline;text-underline-offset:3px}
.link:focus-visible{outline:2px solid var(--green)}
.err{font-size:13px;color:var(--danger);min-height:1em}
.info{font-size:12.5px;color:var(--muted);border-left:2px solid var(--green-dim);padding-left:10px}
.doc{font-size:14px;color:var(--fg);display:flex;flex-direction:column;gap:10px}
.doc p{margin:0}
.paybox{display:flex;flex-direction:column;gap:10px}
a.btn{display:block;text-align:center;text-decoration:none}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<canvas id="rain" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="wrap">
  <header class="top">
    <div class="mark">Matrix Event</div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ka" id="lang-ka">GE</button>
      <button type="button" data-lang="en" id="lang-en">EN</button>
      <button type="button" data-lang="ru" id="lang-ru">RU</button>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1><span class="g">MATRIX</span><br>EVENT<br>TBILISI</h1>
    <div class="meta">
      <span><b data-i18n="dateLabel"></b><span id="date"></span></span>
      <span><b data-i18n="placeLabel"></b><span id="place"></span></span>
    </div>
  </section>

  <section aria-labelledby="tickets-h">
    <h2 class="section-h" id="tickets-h" data-i18n="tickets"></h2>
    <div class="tickets" id="tickets"></div>
  </section>

  <p class="note" data-i18n="footnote"></p>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <!-- checkout view -->
    <div id="v-checkout" class="sheet-body" style="display:contents">
      <div class="sheet-h">
        <div>
          <h2 id="sheet-title" data-i18n="checkoutTitle"></h2>
          <div class="sel" id="sel"></div>
        </div>
        <button class="x" type="button" data-close aria-label="Close">×</button>
      </div>
      <form id="form" novalidate>
        <div class="fields">
          <div class="f"><label for="fn" data-i18n="first"></label><input id="fn" name="fn" autocomplete="given-name" required></div>
          <div class="f"><label for="ln" data-i18n="last"></label><input id="ln" name="ln" autocomplete="family-name" required></div>
          <div class="f full"><label for="dob" data-i18n="dob"></label><input id="dob" name="dob" type="date" autocomplete="bday" min="1930-01-01" max="2010-12-31" required></div>
          <div class="f full"><label for="em" data-i18n="email"></label><input id="em" name="em" type="email" inputmode="email" autocomplete="email" required></div>
        </div>
      </form>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="c-refund"><span><span data-i18n="agreeRefund"></span> <button type="button" class="link" data-doc="refund" data-i18n="refund"></button></span></label>
        <label class="chk"><input type="checkbox" id="c-privacy"><span><span data-i18n="agreePrivacy"></span> <button type="button" class="link" data-doc="privacy" data-i18n="privacy"></button></span></label>
      </div>
      <div class="info" data-i18n="qrInfo"></div>
      <div class="err" id="err" role="alert"></div>
      <div class="paybox">
        <button class="btn" type="button" id="pay"></button>
        <a class="btn" id="paylink" target="_blank" rel="noopener" hidden></a>
      </div>
    </div>
    <!-- document view -->
    <div id="v-doc" hidden>
      <div class="sheet-h">
        <h2 id="doc-title"></h2>
        <button class="x" type="button" id="doc-back" aria-label="Back">←</button>
      </div>
      <div class="doc" id="doc-body" style="margin-top:14px"></div>
      <button class="btn ghost" type="button" id="doc-ok" style="margin-top:18px" data-i18n="back"></button>
    </div>
  </div>
</div>

<script>
/* ===== EDIT HERE ===== */
const CONFIG = {

/* ===================== */

const TICKETS = [

];

const T = {
  ka:{ eyebrow:"დახურული წვეულება", dateLabel:"თარიღი", placeLabel:"ადგილი", tickets:"ბილეთები", buy:"ყიდვა", maxTag:"მაქსიმუმი",
       checkoutTitle:"ბილეთის შეძენა", first:"სახელი", last:"გვარი", dob:"დაბადების თარიღი", email:"ელ. ფოსტა",
       agreeRefund:"ვეთანხმები", refund:"თანხის დაბრუნების პირობებს", agreePrivacy:"ვეთანხმები", privacy:"კონფიდენციალურობის პოლიტიკას",

       pay:"გადახდაზე გადასვლა", payOpen:"ბანკის გვერდის გახსნა", back:"უკან",
       errFill:"შეავსეთ სახელი, გვარი, დაბადების თარიღი და ელ. ფოსტა.", errEmail:"შეამოწმეთ ელ. ფოსტის მისამართი.", errChecks:"მონიშნეთ ორივე პუნქტი.",
       noLink:"გადახდის ბმული ჯერ არ არის დამატებული.",

       refundTitle:"თანხის დაბრუნების პირობები",
       refundBody:["ბილეთის დაბრუნება შესაძლებელია ღონისძიებამდე 7 დღით ადრე. თანხა ბრუნდება იმავე ბარათზე 10 სამუშაო დღის განმავლობაში.","ღონისძიებამდე 7 დღეზე ნაკლები დროით ადრე ბილეთი არ ბრუნდება.","ღონისძიების გაუქმების შემთხვევაში თანხა სრულად ბრუნდება."],
       privacyTitle:"კონფიდენციალურობის პოლიტიკა",

  en:{ eyebrow:"Private party", dateLabel:"Date", placeLabel:"Place", tickets:"Tickets", buy:"Buy", maxTag:"Everything included",

       pay:"Перейти к оплате", payOpen:"Открыть страницу банка", back:"Назад",

let lang = "ru";
try { const s = localStorage.getItem("mx-lang"); if (s && T[s]) lang = s; } catch(e) {}
let current = null;

const $ = s => document.querySelector(s);
const t = k => T[lang][k];

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#date").textContent = CONFIG.date[lang];
  $("#place").textContent = CONFIG.place[lang];
  const box = $("#tickets"); box.textContent = "";
  TICKETS.forEach(tk => {
    const card = document.createElement("article");
    card.className = "ticket" + (tk.vip ? " vip" : "");
    const head = document.createElement("div");
    head.style.cssText = "display:flex;flex-direction:column;gap:6px";
    const nm = document.createElement("div"); nm.className = "t-name"; nm.textContent = tk.name; head.appendChild(nm);
    if (tk.vip){ const tag = document.createElement("div"); tag.className = "t-tag"; tag.textContent = t("maxTag"); head.appendChild(tag); }
    const pr = document.createElement("div"); pr.className = "price";
    pr.innerHTML = tk.price + "<small>" + CONFIG.currency + "</small>";
    const ul = document.createElement("ul"); ul.className = "incl";
    tk.incl[lang].forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
    const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.id = "buy-" + tk.id;
    b.textContent = t("buy"); b.addEventListener("click", () => openSheet(tk));
    card.append(head, pr, ul, b);
    box.appendChild(card);
  });
  if (current) $("#sel").textContent = current.name + " · " + current.price + " " + CONFIG.currency;
  $("#pay").textContent = t("pay");
  $("#paylink").textContent = t("payOpen");
  $("#err").textContent = "";
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("mx-lang", lang); } catch(e) {}
  render();
}));

/* sheet */
let lastFocus = null;
function openSheet(tk){
  current = tk; lastFocus = document.activeElement;
  $("#sel").textContent = tk.name + " · " + tk.price + " " + CONFIG.currency;
  showView("checkout");
  $("#paylink").hidden = true; $("#pay").hidden = false; $("#err").textContent = "";
  $("#overlay").hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#fn").focus(), 30);
}
function closeSheet(){
  $("#overlay").hidden = true; document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
function showView(v){
  $("#v-checkout").style.display = v === "checkout" ? "contents" : "none";
  $("#v-doc").hidden = v !== "doc";
}
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeSheet(); });

document.querySelectorAll("[data-doc]").forEach(b => b.addEventListener("click", e => {
  e.preventDefault(); e.stopPropagation();
  const k = b.dataset.doc;
  $("#doc-title").textContent = t(k + "Title");
  const body = $("#doc-body"); body.textContent = "";
  t(k + "Body").forEach(p => { const el = document.createElement("p"); el.textContent = p; body.appendChild(el); });
  showView("doc");
}));
["#doc-back","#doc-ok"].forEach(s => $(s).addEventListener("click", () => showView("checkout")));

["#fn","#ln","#dob","#em"].forEach(s => $(s).addEventListener("input", e => e.target.removeAttribute("aria-invalid")));
$("#form").addEventListener("submit", e => { e.preventDefault(); pay(); });
$("#pay").addEventListener("click", pay);

function pay(){
  const fn = $("#fn"), ln = $("#ln"), dob = $("#dob"), em = $("#em"), err = $("#err");
  let bad = false;
  [fn, ln, dob, em].forEach(i => { if (!i.value.trim()){ i.setAttribute("aria-invalid","true"); bad = true; } });
  if (bad){ err.textContent = t("errFill"); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())){ em.setAttribute("aria-invalid","true"); err.textContent = t("errEmail"); return; }
  if (!$("#c-refund").checked || !$("#c-privacy").checked){ err.textContent = t("errChecks"); return; }
  const url = CONFIG.payUrl[current.id];
  if (!url){ err.textContent = t("noLink"); return; }
  err.textContent = "";
  const a = $("#paylink"); a.href = url; a.hidden = false; $("#pay").hidden = true; a.focus();
}

/* code rain */
(function(){
  const c = document.getElementById("rain");
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const x = c.getContext("2d");
  const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789MATRIXᲛᲐᲢᲠᲘᲥᲡ";
  let w = 0, h = 0, cols = 0, drops = [], fs = 16;
  function size(){
    const nw = c.clientWidth || window.innerWidth, nh = c.clientHeight || window.innerHeight;
    if (!nw || !nh) return;
    if (nw === w && Math.abs(nh - h) < 120 && cols) return; // ignore mobile address-bar jumps
    const d = Math.min(window.devicePixelRatio || 1, 2);
    w = nw; h = nh;
    c.width = Math.round(w * d); c.height = Math.round(h * d); x.setTransform(d,0,0,d,0,0);
    fs = w < 500 ? 14 : 16;
    cols = Math.ceil(w / fs);
    drops = Array.from({length: cols}, () => Math.random() * h / fs - 10);
    x.fillStyle = "#050806"; x.fillRect(0,0,w,h);
  }
  size();
  addEventListener("resize", size);
  addEventListener("orientationchange", () => { w = 0; setTimeout(size, 200); });
  if (window.ResizeObserver) new ResizeObserver(size).observe(c);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) size(); });
  let last = 0;
  const step = calm ? 220 : 55;
  function frame(ts){
    if (!cols) size();
    if (cols && ts - last > step){
      last = ts;
      x.fillStyle = "rgba(5,8,6,0.09)"; x.fillRect(0,0,w,h);
      x.font = fs + "px 'IBM Plex Mono', monospace";
      for (let i = 0; i < cols; i++){
        const ch = chars[Math.floor(Math.random() * chars.length)];
        const y = drops[i] * fs;
        x.fillStyle = Math.random() > .975 ? "#d9f2df" : "#3dff7a";
        x.fillText(ch, i * fs, y);
        if (y > h && Math.random() > .975) drops[i] = 0;
        drops[i] += 1;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

render();
</script>
