*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;min-height:100%;overflow-x:hidden}

img{max-width:100%}
[hidden]{display:none!important}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mark{font-family:var(--body);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(11,18,13,.8)}

.tickets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* code rain */
function CodeRain(){
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current;
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const x = c.getContext("2d");
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789MATRIXᲛᲐᲢᲠᲘᲥᲡ";
    let w = 0, h = 0, cols = 0, drops = [], fs = 16, raf = 0, last = 0;
    function size(){
      const nw = c.clientWidth || window.innerWidth, nh = c.clientHeight || window.innerHeight;
      if (!nw || !nh) return;
      if (nw === w && Math.abs(nh - h) < 120 && cols) return; // ignore mobile address-bar jumps
      const d = Math.min(window.devicePixelRatio || 1, 2);
      w = nw; h = nh;
      c.width = Math.round(w * d); c.height = Math.round(h * d); x.setTransform(d,0,0,d,0,0);
      fs = w < 500 ? 14 : 16;
      cols = Math.ceil(w / fs);
      drops = Array.from({length: cols}, () => Math.random() * h / fs - 10);
      x.fillStyle = "#050806"; x.fillRect(0,0,w,h);
    }
    const onOrient = () => { w = 0; setTimeout(size, 200); };
    const onVis = () => { if (!document.hidden) size(); };
    size();
    addEventListener("resize", size);
    addEventListener("orientationchange", onOrient);
    document.addEventListener("visibilitychange", onVis);
    const ro = window.ResizeObserver ? new ResizeObserver(size) : null;
    if (ro) ro.observe(c);
    const step = calm ? 220 : 55;
    function frame(ts){
      if (!cols) size();
      if (cols && ts - last > step){
        last = ts;
        x.fillStyle = "rgba(5,8,6,0.09)"; x.fillRect(0,0,w,h);
        x.font = fs + "px 'IBM Plex Mono', monospace";
        for (let i = 0; i < cols; i++){
          const ch = chars[Math.floor(Math.random() * chars.length)];
          const y = drops[i] * fs;
          x.fillStyle = Math.random() > .975 ? "#d9f2df" : "#3dff7a";
          x.fillText(ch, i * fs, y);
          if (y > h && Math.random() > .975) drops[i] = 0;
          drops[i] += 1;
        }
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => {
      cancelAnimationFrame(raf);
      removeEventListener("resize", size);
      removeEventListener("orientationchange", onOrient);
      document.removeEventListener("visibilitychange", onVis);
      if (ro) ro.disconnect();
    };
  }, []);
  return <canvas id="rain" ref={ref} aria-hidden="true" />;
}

  const [payUrl, setPayUrl] = useState("");
  const firstRef = useRef(null);
  const payLinkRef = useRef(null);

  useEffect(() => { const id = setTimeout(() => firstRef.current && firstRef.current.focus(), 30); return () => clearTimeout(id); }, []);
  useEffect(() => { if (payUrl && payLinkRef.current) payLinkRef.current.focus(); }, [payUrl]);

  const setField = k => e => {
    const v = e.target.value;
    setForm(f => ({ ...f, [k]: v }));
    setInvalid(i => ({ ...i, [k]: false }));
  };

  function pay(e){
    if (e) e.preventDefault();
    const bad = {};
    Object.keys(EMPTY_FORM).forEach(k => { if (!form[k].trim()) bad[k] = true; });
    if (Object.keys(bad).length){ setInvalid(bad); setErrKey("errFill"); return; }
    if (!EMAIL_RE.test(form.em.trim())){ setInvalid({ em:true }); setErrKey("errEmail"); return; }
    if (!checks.refund || !checks.privacy){ setErrKey("errChecks"); return; }
    const url = CONFIG.payUrl[ticket.id];
    if (!url){ setErrKey("noLink"); return; }
    setErrKey("");
    setPayUrl(url);
  }

  const openDoc = k => e => { e.preventDefault(); e.stopPropagation(); setView(k); };

  const field = (k, label, props, full) => (
    <div className={"f" + (full ? " full" : "")}>
      <label htmlFor={k}>{t(label)}</label>
      <input id={k} name={k} value={form[k]} onChange={setField(k)} aria-invalid={invalid[k] ? "true" : undefined} required {...props} />
    </div>
  );

  if (view !== "checkout"){
    return (
      <div>
        <div className="sheet-h">
          <h2 id="sheet-title">{t(view + "Title")}</h2>
          <button className="x" type="button" aria-label="Back" onClick={() => setView("checkout")}>←</button>
        </div>
        <div className="doc">{t(view + "Body").map((p, i) => <p key={i}>{p}</p>)}</div>
        <button className="btn ghost" type="button" style={{marginTop:18}} onClick={() => setView("checkout")}>{t("back")}</button>
      </div>
    );
  }

  return (
    <>
      <div className="sheet-h">
        <div>
          <h2 id="sheet-title">{t("checkoutTitle")}</h2>
          <div className="sel">{ticket.name} · {ticket.price} {CONFIG.currency}</div>
        </div>
        <button className="x" type="button" aria-label="Close" onClick={onClose}>×</button>
      </div>
      <form noValidate onSubmit={pay}>
        <div className="fields">
          {field("fn", "first", { autoComplete:"given-name", ref:firstRef })}
          {field("ln", "last", { autoComplete:"family-name" })}
          {field("dob", "dob", { type:"date", autoComplete:"bday", min:"1930-01-01", max:"2010-12-31" }, true)}
          {field("em", "email", { type:"email", inputMode:"email", autoComplete:"email" }, true)}
        </div>
      </form>
      <div className="checks">
        {["refund","privacy"].map(k => (
          <label className="chk" key={k}>
            <input type="checkbox" checked={checks[k]} onChange={e => setChecks(c => ({ ...c, [k]: e.target.checked }))} />
            <span>{t(k === "refund" ? "agreeRefund" : "agreePrivacy")} <button type="button" className="link" onClick={openDoc(k)}>{t(k)}</button></span>
          </label>
        ))}
      </div>
      <div className="info">{t("qrInfo")}</div>
      <div className="err" role="alert">{errKey ? t(errKey) : ""}</div>
      <div className="paybox">
        {payUrl
          ? <a className="btn" href={payUrl} target="_blank" rel="noopener" ref={payLinkRef}>{t("payOpen")}</a>
          : <button className="btn" type="button" onClick={pay}>{t("pay")}</button>}
      </div>
    </>
  );
}

function App(){
  const [lang, setLang] = useState(initialLang);
  const [current, setCurrent] = useState(null);
  const lastFocus = useRef(null);
  const t = useCallback(k => T[lang][k], [lang]);

  useEffect(() => {
    document.documentElement.lang = lang;
    try { localStorage.setItem("mx-lang", lang); } catch(e) {}
  }, [lang]);

  const open = (tk, el) => { lastFocus.current = el; setCurrent(tk); };
  const close = useCallback(() => {
    setCurrent(null);
    if (lastFocus.current) lastFocus.current.focus();
  }, []);

  useEffect(() => {
    if (!current) return;
    document.body.style.overflow = "hidden";
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = ""; document.removeEventListener("keydown", onKey); };
  }, [current, close]);

  return (
    <>
      <CodeRain />
      <div className="veil" aria-hidden="true" />

      <div className="wrap">
        <header className="top">
          <div className="mark">Matrix Event</div>
          <div className="langs" role="group" aria-label="Language">
            {LANGS.map(([code, label]) => (
              <button key={code} type="button" aria-pressed={lang === code} onClick={() => setLang(code)}>{label}</button>
            ))}
          </div>
        </header>

        <section className="hero">
          <div className="eyebrow">{t("eyebrow")}</div>
          <h1><span className="g">MATRIX</span><br />EVENT<br />TBILISI</h1>
          <div className="meta">
            <span><b>{t("dateLabel")}</b><span>{CONFIG.date[lang]}</span></span>
            <span><b>{t("placeLabel")}</b><span>{CONFIG.place[lang]}</span></span>
          </div>
        </section>

        <section aria-labelledby="tickets-h">
          <h2 className="section-h" id="tickets-h">{t("tickets")}</h2>
          <div className="tickets">
            {TICKETS.map(tk => <TicketCard key={tk.id} ticket={tk} lang={lang} t={t} onBuy={open} />)}
          </div>
        </section>

        <p className="note">{t("footnote")}</p>
      </div>

      {current && (
        <div className="overlay" onClick={e => { if (e.target === e.currentTarget) close(); }}>
          <div className="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <Checkout key={current.id} ticket={current} t={t} onClose={close} />
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
